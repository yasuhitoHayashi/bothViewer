<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>EVS Data Viewer</title><link rel="stylesheet" href="static/evsModes.css"></head>
<body><header class="top"><div><b>bothViewer</b><span id="modeTitle">EVSデータ確認</span></div><a href="modeSelector.html">モード選択</a></header>
<main class="data-layout"><aside class="panel"><div class="aside-head"><h2>セッション</h2><button id="refreshButton">更新</button></div><div id="sessionList" class="session-list"></div></aside>
<section class="panel playback"><h2 id="sessionTitle">セッションを選択</h2><div id="playbackGrid" class="live-grid"></div><div class="controls"><button id="playButton" disabled>▶ 再生</button><input id="timeline" type="range" min="0" max="1" value="0" step="1" disabled><span id="timeText">0.000 s</span><select id="windowUs"><option value="10000">10 ms</option><option value="33000" selected>33 ms</option><option value="100000">100 ms</option></select></div><p id="detailText"></p></section></main><p id="message" class="message"></p><script src="static/evsDataViewer.js"></script></body></html>
